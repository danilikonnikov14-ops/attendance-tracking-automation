stages:
  - build
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  DOCKER_IMAGE_BACKEND: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_SHORT_SHA
  DOCKER_IMAGE_BACKEND_LATEST: $CI_REGISTRY_IMAGE/backend:latest
  DOCKER_IMAGE_FRONTEND: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_SHORT_SHA
  DOCKER_IMAGE_FRONTEND_LATEST: $CI_REGISTRY_IMAGE/frontend:latest

cache:
  paths:
    - .cache/pip/

build-backend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.19.0-debug
    entrypoint: [""]
  tags:
    - docker
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' \
        "$CI_REGISTRY" \
        "$(echo -n "gitlab-ci-token:$CI_JOB_TOKEN" | base64 | tr -d '\n')" \
        > /kaniko/.docker/config.json
  script:
    - echo "Building backend with Kaniko..."
    - /kaniko/executor
      --context="${CI_PROJECT_DIR}/backend"
      --dockerfile="${CI_PROJECT_DIR}/backend/Dockerfile.backend"
      --destination="${CI_REGISTRY_IMAGE}/backend:${CI_COMMIT_SHORT_SHA}"
      --destination="${CI_REGISTRY_IMAGE}/backend:latest"
      --cache=true
      --cache-dir=/tmp/cache
  only:
    - main
  when: on_success

build-frontend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.19.0-debug
    entrypoint: [""]
  tags:
    - docker
  before_script:
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' \
        "$CI_REGISTRY" \
        "$(echo -n "gitlab-ci-token:$CI_JOB_TOKEN" | base64 | tr -d '\n')" \
        > /kaniko/.docker/config.json
  script:
    - echo "Building frontend with Kaniko..."
    - /kaniko/executor
      --context="${CI_PROJECT_DIR}/frontend"
      --dockerfile="${CI_PROJECT_DIR}/frontend/Dockerfile.frontend"
      --destination="${CI_REGISTRY_IMAGE}/frontend:${CI_COMMIT_SHORT_SHA}"
      --destination="${CI_REGISTRY_IMAGE}/frontend:latest"
      --cache=true
      --cache-dir=/tmp/cache
  only:
    - main
  when: on_success

deploy:
  stage: deploy
  image: alpine:latest
  tags:
    - docker
  before_script:
    - apk add --no-cache openssh-client sshpass bash
  script:
    - echo "Deploying to $DEPLOY_HOST..."
    - sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no docker-compose.yml $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker-compose.yml
    - sshpass -p "$SSH_PASSWORD" scp -o StrictHostKeyChecking=no nginx/nginx.conf $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/nginx/nginx.conf
    - sshpass -p "$SSH_PASSWORD" ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST "
        cd $DEPLOY_PATH &&
        export CI_REGISTRY_IMAGE=$CI_REGISTRY_IMAGE &&
        export CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA &&
        docker-compose pull &&
        docker-compose up -d --remove-orphans
      "
    - echo "Deployment completed!"
  only:
    - main
  when: on_success
  environment:
    name: production
    url: http://$DEPLOY_HOST